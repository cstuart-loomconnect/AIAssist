<template>
  <template lwc:if={view}>
    <div class={bannerClass} role="status">
      <!-- Heading: the limit, and what it stops -->
      <div class="text slds-grid slds-grid_vertical">
        <span class="title">{view.title}</span>
        <span class="sub">{view.subLabel}</span>
      </div>

      <!-- Meter: how much of the limit has been used -->
      <div class="slds-grid slds-grid_vertical meter-block">
        <div
          class="slds-progress-bar"
          role="progressbar"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow={view.percent}
          aria-label={view.usageLabel}
        >
          <span
            class="slds-progress-bar__value meter-value"
            style={meterStyle}
          ></span>
        </div>
        <div class="meter-row slds-grid slds-grid_align-spread">
          <span>{view.usageLabel}</span>
          <span>{view.resetLabel}</span>
        </div>
      </div>

      <!-- Button: to end a conversation when too many are open -->
      <template lwc:if={view.showHistoryButton}>
        <button type="button" class="action" onclick={handleOpenHistory}>
          {labels.openHistory}
        </button>
      </template>
    </div>
  </template>
</template>
