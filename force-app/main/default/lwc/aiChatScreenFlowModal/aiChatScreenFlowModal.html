<template>
  <!-- Modal title -->
  <lightning-modal-header label={label}></lightning-modal-header>

  <!-- The flow itself: runs as the signed-in user and reports each status change -->
  <lightning-modal-body>
    <lightning-flow flow-api-name={flowApiName} flow-input-variables={inputVariables} onstatuschange={handleStatusChange}></lightning-flow>
  </lightning-modal-body>
</template>
