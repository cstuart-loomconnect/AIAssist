<template>
  <!-- Who gets this policy: a bordered box with a head and a table -->
  <div class="aipa-box slds-m-bottom_medium">
    <!-- Head: the title and the button that adds an assignment -->
    <div class="aipa-box-head slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
      <span class="aipa-box-title">{labels.whoGets}</span>
      <lightning-button variant="brand" label={labels.addAssignment} onclick={handleAddAssignment}></lightning-button>
    </div>

    <!-- Table: one row for each user or permission set -->
    <template lwc:if={hasAssignments}>
      <table class="aipa-table slds-table slds-table_cell-buffer">
        <thead>
          <tr>
            <th scope="col">{labels.columnType}</th>
            <th scope="col">{labels.columnAssignedTo}</th>
            <th scope="col">{labels.columnUsersCovered}</th>
            <th scope="col">{labels.columnActive}</th>
            <th scope="col"></th>
          </tr>
        </thead>
        <tbody>
          <template for:each={assignmentViews} for:item="assignment">
            <tr key={assignment.key}>
              <td><span class={assignment.typeClass}>{assignment.typeLabel}</span></td>
              <td>
                <div class="aipa-name">{assignment.name}</div>
                <template lwc:if={assignment.hasCaption}><div class="aipa-caption slds-text-body_small">{assignment.caption}</div></template>
              </td>
              <td>{assignment.usersCovered}</td>
              <td><lightning-input type="toggle" variant="label-hidden" label={labels.columnActive} checked={assignment.isActive} data-id={assignment.assignmentId} message-toggle-active="" message-toggle-inactive="" onchange={handleActiveChange}></lightning-input></td>
              <td class="aipa-actions"><button type="button" class="slds-button slds-button_neutral" data-id={assignment.assignmentId} onclick={handleRemove}>{labels.remove}</button></td>
            </tr>
          </template>
        </tbody>
      </table>
    </template>

    <!-- Nobody: shown when the policy has no assignments -->
    <template lwc:else><p class="aipa-caption slds-p-around_medium slds-m-bottom_none">{labels.none}</p></template>
  </div>

  <!-- How a user's policy is chosen: the three steps in order, and what happens when two permission sets disagree -->
  <div class="aipa-box slds-m-bottom_medium">
    <div class="aipa-box-head"><span class="aipa-box-title">{labels.howChosen}</span></div>
    <div class="slds-p-around_medium">
      <div class="slds-grid slds-wrap slds-grid_vertical-align-center aipa-steps">
        <span class="aipa-step">{labels.stepUser}</span>
        <span class="aipa-caption">{labels.then}</span>
        <span class="aipa-step">{labels.stepPermissionSet}</span>
        <span class="aipa-caption">{labels.then}</span>
        <span class="aipa-step">{labels.stepDefault}</span>
      </div>
      <p class="aipa-caption slds-text-body_small slds-m-top_small slds-m-bottom_none">{labels.stricterWins}</p>
    </div>
  </div>

  <!-- Check a user: finds a user and says which policy they get -->
  <c-ai-policies-check-user onassign={handleAssignUser}></c-ai-policies-check-user>
</template>
