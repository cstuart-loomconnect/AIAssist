name: Create Package Version

# Manual: builds a managed 2GP beta package version from master (or the chosen ref).
# Prerequisite: the package exists in the Dev Hub and sfdx-project.json has a packageAliases entry.
on:
  workflow_dispatch:
    inputs:
      skip_validation:
        description: Skip validation (faster beta, cannot be promoted)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  create-version:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @salesforce/cli
      - name: Authenticate Dev Hub
        env:
          DEVHUB_SFDX_AUTH_URL: ${{ secrets.DEVHUB_SFDX_AUTH_URL }}
        run: |
          echo "$DEVHUB_SFDX_AUTH_URL" > devhub.txt
          sf org login sfdx-url --sfdx-url-file devhub.txt --alias devhub --set-default-dev-hub
          rm devhub.txt
      - name: Create package version
        run: |
          flags=""
          if [ "${{ inputs.skip_validation }}" = "true" ]; then flags="--skip-validation"; else flags="--code-coverage"; fi
          sf package version create --package AIAssist --installation-key-bypass $flags --wait 90
