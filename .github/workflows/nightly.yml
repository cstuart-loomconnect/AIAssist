name: Nightly Build

# Full scratch org Apex test run against development, from AIAssist-CICD. Opens an issue if it fails.
# Scheduled workflows only run from the default branch (master), so the schedule starts working
# once this file reaches master.
on:
  # Switched off for now: uncomment to run every night at 02:00 UTC.
  # schedule:
  #   - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly:
    uses: cstuart-loomconnect/AIAssist-CICD/.github/workflows/nightly.yml@v1
    with:
      ref: development
      cicd-ref: v1
    secrets: inherit
