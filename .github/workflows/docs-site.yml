name: Documentation site

# Generates the reference pages from the source, builds the MkDocs site and publishes it to GitHub Pages.
# One-off setup: Settings > Pages > Build and deployment > Source = GitHub Actions, and allow the
# development branch under Settings > Environments > github-pages > Deployment branches.
on:
  push:
    branches: [development]
    paths:
      - 'documentation/**'
      - 'mkdocs.yml'
      - 'scripts/docs/**'
      - 'force-app/**'
      - 'docs/known-issues.txt'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the changelog and class histories are read from git
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r scripts/docs/requirements.txt
      - run: python3 scripts/docs/generate.py
      - run: mkdocs build --strict
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
