name: PR Validation

# Runs the shared checks from AIAssist-CICD on every pull request between branches:
# formatting, lint, SLDS, Code Analyzer, npm audit, naming, then scratch org Apex tests.
# Change the checks in AIAssist-CICD, not here. Keep cicd-ref the same as the @ref.
on:
  pull_request:
    branches: [development, master]

concurrency:
  group: pr-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    uses: cstuart-loomconnect/AIAssist-CICD/.github/workflows/pr-validation.yml@v1
    with:
      cicd-ref: v1
      # Browser tests run in their own workflow (browser-tests.yml), not here.
      e2e: false
    secrets: inherit
