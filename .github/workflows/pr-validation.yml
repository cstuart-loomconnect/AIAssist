name: PR Validation

# Runs on pull requests into development or master, on pushes to feature branches, and on every
# merge into development (post-merge integration run).
on:
  pull_request:
    branches: [development, master]
  push:
    branches: ['feature/**', development]

concurrency:
  group: pr-validation-${{ github.ref }}
  # Never cancel a post-merge run on development; each merge gets its own result.
  cancel-in-progress: ${{ github.ref != 'refs/heads/development' }}

permissions:
  contents: read

jobs:
  detect:
    name: Detect changed metadata
    runs-on: ubuntu-latest
    outputs:
      has_apex: ${{ steps.scan.outputs.has_apex }}
      has_lwc: ${{ steps.scan.outputs.has_lwc }}
      has_source: ${{ steps.scan.outputs.has_source }}
    steps:
      - uses: actions/checkout@v7
      - id: scan
        run: |
          apex=$(find force-app -name '*.cls' -o -name '*.trigger' | head -1)
          lwc=$(find force-app -path '*/lwc/*' -name '*.js' -not -path '*/__tests__/*' | head -1)
          source=$(find force-app -type f -not -name '.gitkeep' | head -1)
          echo "has_apex=$([ -n "$apex" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_lwc=$([ -n "$lwc" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_source=$([ -n "$source" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  format-and-lint:
    name: Prettier + ESLint (LWC/Aura)
    needs: detect
    if: needs.detect.outputs.has_source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run prettier:verify
      - run: npx eslint "force-app/**/{aura,lwc}/**/*.js" --no-error-on-unmatched-pattern

  slds-validator:
    name: SLDS Validator
    needs: detect
    if: needs.detect.outputs.has_lwc == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Lints LWC HTML/CSS for SLDS styling-hook, deprecated class and hardcoded value issues.
      - name: SLDS lint
        run: npx --yes @salesforce-ux/slds-linter@latest lint force-app
      - name: SLDS report
        if: always()
        continue-on-error: true
        run: |
          mkdir -p slds-report
          npx --yes @salesforce-ux/slds-linter@latest report force-app --format sarif --output slds-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slds-report
          path: slds-report/
          if-no-files-found: ignore

  code-analyzer:
    name: Salesforce Code Analyzer
    needs: detect
    if: needs.detect.outputs.has_source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # The Flow engine in Code Analyzer needs Python 3.10+.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm install --global @salesforce/cli
      - run: sf plugins install code-analyzer
      # Fails the job on severity 2 (High) or worse. Config lives in code-analyzer.yml.
      - name: Run Code Analyzer
        run: |
          sf code-analyzer run \
            --workspace force-app \
            --config-file code-analyzer.yml \
            --rule-selector Recommended \
            --rule-selector AppExchange \
            --severity-threshold 2 \
            --view table \
            --output-file code-analyzer-results.html \
            --output-file code-analyzer-results.sarif \
            --output-file code-analyzer-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-analyzer-results
          path: code-analyzer-results.*
          if-no-files-found: ignore

  dependency-audit:
    name: Dependency audit (npm)
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      - run: npm audit --audit-level=high

  naming-conventions:
    name: Naming conventions
    needs: detect
    if: needs.detect.outputs.has_source == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/ci/check-naming.js

  scratch-org-tests:
    name: Scratch org + Apex tests
    needs: [detect, format-and-lint, code-analyzer, dependency-audit, naming-conventions]
    # Skip if a prerequisite was skipped for lack of source; fail if one failed.
    if: needs.detect.outputs.has_apex == 'true' && !cancelled() && !contains(needs.*.result, 'failure')
    uses: ./.github/workflows/scratch-org-tests.yml
    secrets: inherit

  pr-comment:
    name: Post results to PR
    needs: [code-analyzer, naming-conventions, scratch-org-tests]
    if: github.event_name == 'pull_request' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: '{code-analyzer-results,apex-test-results}'
      - uses: actions/github-script@v9
        # Fork PRs get a read-only token; don't fail the run over a missing comment.
        continue-on-error: true
        env:
          NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            const script = require('./scripts/ci/pr-comment.js');
            await script({ github, context, needs: JSON.parse(process.env.NEEDS) });
