name: PR Hygiene

# Labels the pull request by area and checks the title is `type: subject` (see CONTRIBUTING.md).
# The rules live in AIAssist-CICD.
on:
  pull_request:
    branches: [development, master]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  hygiene:
    uses: cstuart-loomconnect/AIAssist-CICD/.github/workflows/pr-hygiene.yml@v1
    with:
      cicd-ref: v1
